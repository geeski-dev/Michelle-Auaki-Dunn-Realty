      <stop offset="55%" stop-color="#f2503c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d6301f" stop-opacity="0" />
    </radialGradient>
    <filter id="softHelp" x="-50%" y="-50%" width="200%" height="200%">
