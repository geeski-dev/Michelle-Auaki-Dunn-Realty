<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder">
  <defs>
    <linearGradient id="skyHelp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb3ac" />
      <stop offset="55%" stop-color="#f4ecdc" />
      <stop offset="100%" stop-color="#fbf7ef" />
